[workspace]
# Virtual packages on `platforms` entries parse only from 0.71.0. Without this,
# an older pixi fails with "expected a string, found table" on the first
# command a reader runs.
requires-pixi = ">=0.71"
authors = ["Alistair Keiller"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "ray-march-lab"
platforms = [
  "linux-64",
  "linux-aarch64",
  "osx-arm64",
  { platform = "linux-64", cuda = "12" },
  { platform = "linux-aarch64", cuda = "12" },
  { platform = "osx-arm64", macos = "15.0" },
]
version = "0.1.0"

[feature.nvidia]
platforms = ["linux-64-cuda-12", "linux-aarch64-cuda-12", "osx-arm64"]
channels = ["nvidia"]

[feature.nvidia.target.linux-64.dependencies]
cuda-toolkit = "12.*" # for compute-sanitizer etc.
cuda-gdb = "12.*"     # for GPU kernel debugging
nsight-compute = "*"  # interactive kernel profiling

[feature.nvidia.target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
nvidia-ml-py = "*"

[feature.nvidia.target.linux-aarch64.dependencies]
cuda-toolkit = "12.*" # for compute-sanitizer etc.
cuda-gdb = "12.*"     # for GPU kernel debugging
nsight-compute = "*"  # interactive kernel profiling

[feature.nvidia.target.linux-aarch64.pypi-dependencies]
torch = { version = "==2.9.0", index = "https://download.pytorch.org/whl/cu130" }
nvidia-ml-py = "*"

[feature.amd]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[feature.amd.target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/rocm6.3" }
pytorch-triton-rocm = {version = "*", index = "https://download.pytorch.org/whl/rocm6.3" }

[feature.apple]
platforms = ["osx-arm64-macos-15-0", "linux-64", "linux-aarch64"]

# Building the book compiles nothing, so it must not inherit the GPU platform
# requirements: the publish runner has no CUDA, and a pixi that enforced them
# would break the deploy with no content change.
[feature.book]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = "==3.12"
mojo = "*" # includes `mojo-compiler`, lsp, debugger, formatter etc.
max = "*"
bash = ">=5.2.21,<6"
manim = ">=0.18.1,<0.19"
mdbook = ">=0.4.48,<0.5"
pre-commit = ">=4.2.0,<5"

[environments]
nvidia = { features = ["nvidia"], solve-group = "nvidia" }
amd = { features = ["amd"], solve-group = "amd" }
apple = { features = ["apple"], solve-group = "apple" }
book = { features = ["book"] }
default = { features = ["nvidia"] }

[tasks]
format = "mojo format harness problems solutions"
format-check = { cmd = "bash -c 'mojo format harness problems solutions && git diff --exit-code harness problems solutions || (echo \"Error: Code is not formatted. Run \\\"pixi run format\\\" to fix.\" && exit 1)'", description = "Check if code is formatted without modifying files" }

tests = { cmd = "bash solutions/run.sh", depends-on = ["edt01"] }

check-book-refs = { cmd = "python3 scripts/check_book_refs.py", description = "Validate book links/images resolve" }

check-skeletons = { cmd = "python3 scripts/check_skeletons.py", description = "Verify each problem skeleton matches its solution outside the fill-in regions" }
check-canaries = { cmd = "python3 scripts/check_canaries.py", description = "Check that every puzzle with a learner-written kernel uses the canary" }
compile-problems = { cmd = "bash scripts/compile_problems.sh", description = "Compile every problem skeleton so a stale starter file fails CI" }

build-book = { cmd = "bash scripts/build_book.sh", description = "Build the mdbook (fonts/lottie-player fall back to a local copy if there's no network access and `fetch-offline-assets`/`--offline` has been run)" }
book = { cmd = "bash scripts/serve_book.sh", description = "Serve mdbook with live reload (fonts/lottie-player fall back to a local copy if there's no network access and `fetch-offline-assets`/`--offline` has been run)" }
build-book-offline = { cmd = "bash scripts/build_book.sh --offline", description = "Build the book, pre-fetching the CDN fallback assets so it's ready to browse with no network access right away" }
book-offline = { cmd = "bash scripts/serve_book.sh --offline", description = "Serve the book, pre-fetching the CDN fallback assets so it's ready to browse with no network access right away" }
fetch-offline-assets = { cmd = "bash scripts/fetch_offline_assets.sh", description = "Pre-fetch the CDN fallback assets (fonts, lottie-player) into book/theme/vendor-cache/" }
clean = { cmd = "cd book && mdbook clean && rm -rf html-*", description = "Remove all book build artifacts" }

# The benchmark marches on a real F1TENTH track. Its distance field is a few MB
# and gitignored, so it is built from the map image on demand.
edt01 = { cmd = "python scripts/track_edt.py maps/Spielberg_map.yaml", inputs = ["maps/Spielberg_map.png", "maps/Spielberg_map.yaml", "scripts/track_edt.py"], outputs = ["maps/Spielberg_map.edt"], description = "Build the Spielberg wall-distance field for the benchmark" }

p01 = { cmd = "mojo -I . problems/p01/p01.mojo", depends-on = ["edt01"] }
viz01 = "cd book/src/puzzle_01 && python puzzle_01_viz.py"

# GPU information and profiling utilities
gpu-info = { cmd = "python3 scripts/gpu_specs.py --summary", description = "Get concise GPU information (cross-platform)" }
gpu-specs = { cmd = "python3 scripts/gpu_specs.py", description = "Get complete GPU architectural specifications (NVIDIA/AMD/Apple Silicon)" }

# macOS environment validation
check-macos = { cmd = "python3 scripts/check_macos_env.py", description = "Validate macOS environment (version, Xcode, Metal toolchain)" }
