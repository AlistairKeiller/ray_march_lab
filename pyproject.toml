[project]
name = "ray-march-lab"
version = "0.1.0"
description = "Ray marching puzzles in Mojo, built around the lidar kernel from warporacer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Pinned to the release the book targets.
    "mojo==1.1.0",
    "max==26.6.0",
    # harness/track.py: map image -> wall-distance field, random drivable poses.
    "numpy>=2.4.4",
    "pillow>=12.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10.9"]

# `harness/` (the canary + map loader the puzzles import) lives at the repo root,
# so `uv run ...` resolves it from any directory.
[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "harness"
module-root = ""
